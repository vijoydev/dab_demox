# This is a Declarative Automation Bundle definition for vj_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: vj_bundle
  uuid: b269160f-8b08-4299-8078-3c25b4ed751b

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405608943375070.10.azuredatabricks.net
    variables:
      catalog: dab_dev
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://adb-7405608943375070.10.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/vijoyjoseph@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Users/vijoyjoseph@outlook.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dab_dev
      schema: prod
    permissions:
      - user_name: vijoyjoseph@outlook.com
        level: CAN_MANAGE
